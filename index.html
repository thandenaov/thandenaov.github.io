<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfcff">
  <title>Đang tải...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body class="is-loading">
  <div id="pageLoader" class="page-loader" aria-label="Đang tải"><span></span></div>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <audio id="bgMusic" loop preload="auto"></audio>
  <button id="musicToggle" class="music-toggle" aria-label="Bật hoặc tắt nhạc">♪</button>
  <div class="bg-glow glow-a"></div><div class="bg-glow glow-b"></div>

  <header class="topbar">
    <button class="top-icon" id="bellBtn" aria-label="Thông báo"><img id="bellIcon" alt="Thông báo"><span id="noticeDot" class="notice-dot" hidden></span></button>
  </header>

  <main class="page">
    <section class="profile">
      <div class="avatar-wrap">
        <span class="avatar-ring ring-one"></span>
        <span class="avatar-ring ring-two"></span>
        <span class="avatar-orbit orbit-one"></span>
        <span class="avatar-orbit orbit-two"></span>
        <div class="avatar-glitch"></div>
        <img id="avatar" alt="Ảnh đại diện">
      </div>
      <p class="hello" id="helloText"></p>
      <h1><span id="profileName"></span><span class="verified" aria-label="Đã xác minh"><span class="verified-ring"></span><span class="verified-core"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 12.4 10.2 16l7.4-8"/></svg></span></span></h1>
      <p class="tagline"><span id="taglinePrefix"></span><strong id="subtitle"></strong></p>
      <div class="socials" id="socials"></div>
    </section>

    <section class="products" id="products"></section>

    <section class="stats-card">
      <div class="stat-item"><span class="trend">⌁</span><strong id="totalViews">0</strong><small>TỔNG TRUY CẬP</small></div>
      <div class="stat-item"><span class="live"><i></i> LIVE</span><span class="trend">⌁</span><strong id="todayDownloads">0</strong><small>LƯỢT TẢI HÔM NAY</small></div>
      <div class="stat-item"><span class="trend">⌁</span><strong id="totalGetKeys">0</strong><small>LƯỢT GET KEY</small></div>
    </section>

    <footer id="footerText"></footer>
  </main>

  <dialog id="modal">
    <button class="modal-close" id="closeModal" aria-label="Đóng">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalMedia"></div>
    <div id="modalText"></div>
  </dialog>

  <script src="assets/app.js?v=20"></script>
</body>
</html>
